name: Materialize YOLOv1 Pages chunks

on:
  workflow_dispatch:
  push:
    branches:
      - feat/yolov1-browser
    paths:
      - ".github/workflows/materialize-yolov1-pages.yml"

permissions:
  contents: write

concurrency:
  group: materialize-yolov1-pages
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOLOV1_TAG: yolov1-browser-int8-122bf7462747
      YOLOV1_FILE: yolov1-voc20-int8.onnx
      YOLOV1_BYTES: "541358513"
      YOLOV1_SHA256: 122bf7462747d0cf140525ed6c1d90424d64cc10b8d96cf17905343ce0306d49
      CHUNK_BYTES: "95000000"
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download verified GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/yolov1-release"
          gh release download "$YOLOV1_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$YOLOV1_FILE" \
            --dir "$RUNNER_TEMP/yolov1-release"
          model="$RUNNER_TEMP/yolov1-release/$YOLOV1_FILE"
          test "$(wc -c < "$model")" = "$YOLOV1_BYTES"
          echo "$YOLOV1_SHA256  $model" | sha256sum --check -

      - name: Split for GitHub Pages
        run: |
          model="$RUNNER_TEMP/yolov1-release/$YOLOV1_FILE"
          rm -rf assets/models/yolov1
          mkdir -p assets/models/yolov1
          split -b "$CHUNK_BYTES" -d -a 2 --additional-suffix=.bin "$model" assets/models/yolov1/part-
          test "$(find assets/models/yolov1 -maxdepth 1 -name 'part-*.bin' -type f | wc -l)" = "6"
          cat assets/models/yolov1/part-*.bin | sha256sum | grep -F "$YOLOV1_SHA256"
          test "$(cat assets/models/yolov1/part-*.bin | wc -c)" = "$YOLOV1_BYTES"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path("assets/models/yolov1")
          parts = []
          for path in sorted(root.glob("part-*.bin")):
              data = path.read_bytes()
              parts.append({
                  "file": path.name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              "sourceRelease": "yolov1-browser-int8-122bf7462747",
              "sourceFile": "yolov1-voc20-int8.onnx",
              "bytes": 541358513,
              "sha256": "122bf7462747d0cf140525ed6c1d90424d64cc10b8d96cf17905343ce0306d49",
              "chunkBytes": 95000000,
              "parts": parts,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Commit verified same-origin chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/yolov1
          if git diff --cached --quiet; then
            echo "YOLOv1 Pages chunks already match the verified release."
            exit 0
          fi
          git commit -m "Materialize verified YOLOv1 Pages chunks"
          git push origin HEAD:feat/yolov1-browser
