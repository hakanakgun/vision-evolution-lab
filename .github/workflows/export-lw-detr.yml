name: export LW-DETR tiny ONNX

on:
  push:
    branches:
      - feat/lw-detr-tiny-browser
    paths:
      - .github/workflows/export-lw-detr.yml
      - tools/export_lw_detr.py
      - tools/smoke_lw_detr_ort_web.cjs

permissions:
  contents: write

concurrency:
  group: lw-detr-export-main
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exporter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Create isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/lw-detr-venv"
          echo "$RUNNER_TEMP/lw-detr-venv/bin" >> "$GITHUB_PATH"

      - name: Install pinned CPU export and validation tools
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==5.13.1 onnx==1.19.0 onnxruntime==1.23.1 pillow==11.3.0 numpy==2.3.2

      - name: Export pinned checkpoint and verify CPU parity
        run: python tools/export_lw_detr.py

      - name: Install pinned ONNX Runtime Web
        run: npm install --prefix "$RUNNER_TEMP/lw-detr-webtest" --no-save --no-audit --no-fund onnxruntime-web@1.30.0

      - name: Open and run the exported graph on ONNX Runtime Web WASM
        run: NODE_PATH="$RUNNER_TEMP/lw-detr-webtest/node_modules" node tools/smoke_lw_detr_ort_web.cjs lw-detr-tiny.onnx

      - name: Publish the verified model asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          tag="lw-detr-tiny-$short_sha-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' \
            'Derived browser export of AnnaZhang/lwdetr_tiny_60e_coco.' \
            'Source revision: 4b636b514dcf623f6eafc9e1ab63b8ad5c513925.' \
            'The upstream model card declares Apache-2.0.' \
            'Exported with the repository-pinned exporter; CPU parity and ONNX Runtime Web WASM smoke tests passed.' \
            > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LW-DETR tiny browser export $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            lw-detr-tiny.onnx \
            lw-detr-tiny-manifest.json
          {
            echo '### LW-DETR export'
            echo ''
            echo "- Release tag: $tag"
            echo "- ONNX bytes: $(stat -c %s lw-detr-tiny.onnx)"
            echo "- SHA-256: $(sha256sum lw-detr-tiny.onnx | cut -d ' ' -f 1)"
          } >> "$GITHUB_STEP_SUMMARY"
