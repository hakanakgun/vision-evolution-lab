name: temporary Time Machine auto-run smoke

on:
  push:
    branches:
      - fix/time-machine-auto-run
    paths:
      - .github/workflows/time-machine-auto-run-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate repository contracts
        run: node scripts/validate.mjs
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/tm-smoke" --no-save --no-audit --no-fund puppeteer-core@24.26.1
      - name: Serve app
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >"$RUNNER_TEMP/http.log" 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/version.json >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/http.log"
          exit 1
      - name: Verify model selection auto-runs
        env:
          NODE_PATH: ${{ runner.temp }}/tm-smoke/node_modules
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          node <<'NODE'
          const path=require('node:path');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage();
              page.setDefaultTimeout(600000);
              page.on('console',msg=>console.log('[browser]',msg.type(),msg.text()));
              page.on('pageerror',err=>console.error('[pageerror]',err.message));
              await page.goto('http://127.0.0.1:8000/?ort=wasm',{waitUntil:'networkidle2',timeout:120000});
              const input=await page.$('#image-file');
              await input.uploadFile(path.resolve('assets/benchmark/coco-val-000000397133.jpg'));
              await page.waitForFunction(()=>document.getElementById('m-inf').textContent!=='—',{timeout:300000});
              const first=await page.evaluate(()=>({model:document.getElementById('active-model-title').textContent,inf:document.getElementById('m-inf').textContent}));
              console.log('initial',JSON.stringify(first));

              await page.click('[data-runnable-model="ssd"]');
              const immediate=await page.evaluate(()=>({
                model:document.getElementById('active-model-title').textContent,
                status:document.getElementById('status').textContent,
                rerunDisabled:document.getElementById('rerun').disabled
              }));
              console.log('after-select',JSON.stringify(immediate));
              if(immediate.model!=='SSD-MobileNetV1 INT8')throw new Error('SSD did not become active');
              if(!immediate.status.includes('Running SSD-MobileNetV1 INT8'))throw new Error('selection did not auto-start SSD inference');
              await page.waitForFunction(()=>document.getElementById('m-inf').textContent!=='—'&&!document.getElementById('rerun').disabled,{timeout:300000});
              const done=await page.evaluate(()=>({model:document.getElementById('active-model-title').textContent,inf:document.getElementById('m-inf').textContent,status:document.getElementById('status').textContent}));
              console.log('completed',JSON.stringify(done));
              if(done.model!=='SSD-MobileNetV1 INT8'||done.inf==='—')throw new Error('SSD auto-run did not complete');
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
