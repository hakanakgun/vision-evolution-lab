name: YOLOv1 compact feasibility

on:
  push:
    branches:
      - experiment/yolov1-compact
    paths:
      - "scripts/yolov1_compact_feasibility.py"
      - ".github/workflows/yolov1-compact-feasibility.yml"
      - "tools/smoke_yolov1_ort_web.cjs"
      - "assets/benchmark/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIBREYOLO_REVISION: c25f6dffb521ea60bc0f63ae3dffb168a7edc466
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout Vision Evolution Lab
        uses: actions/checkout@v4

      - name: Runner capacity
        run: |
          free -h
          df -h /
          nproc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Checkout pinned LibreYOLO
        run: |
          git clone --filter=blob:none https://github.com/LibreYOLO/libreyolo.git _libreyolo
          git -C _libreyolo checkout "$LIBREYOLO_REVISION"
          test "$(git -C _libreyolo rev-parse HEAD)" = "$LIBREYOLO_REVISION"

      - name: Install pinned conversion and quantization tools
        run: |
          python -m pip install -e "./_libreyolo[onnx]"
          python -m pip install "huggingface_hub>=0.34,<2" "onnxruntime==1.30.0" "onnx-ir>=0.1.16" pillow
          python - <<'PY'
          import onnxruntime, torch
          print("torch", torch.__version__)
          print("onnxruntime", onnxruntime.__version__)
          PY

      - name: Build compact YOLOv1 candidates
        run: |
          /usr/bin/time -v python scripts/yolov1_compact_feasibility.py

      - name: Candidate sizes
        if: always()
        run: |
          find artifacts/yolov1-compact -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          free -h
          df -h /

      - name: Install pinned ONNX Runtime Web
        if: always()
        run: npm install --prefix "$RUNNER_TEMP/yolov1-webtest" --no-save --no-audit --no-fund onnxruntime-web@1.30.0

      - name: Smoke compact candidates on ONNX Runtime Web WASM
        if: always()
        run: |
          mkdir -p artifacts/yolov1-compact/web-smoke
          set +e
          for name in dynamic-int8 dynamic-int8-local-int4-b32 dynamic-int8-local-int4-b128; do
            model="artifacts/yolov1-compact/yolov1-voc20-${name}.onnx"
            log="artifacts/yolov1-compact/web-smoke/${name}.log"
            if [ ! -f "$model" ]; then
              echo "missing $model" | tee "$log"
              continue
            fi
            echo "=== $name ===" | tee "$log"
            NODE_PATH="$RUNNER_TEMP/yolov1-webtest/node_modules" \
              node tools/smoke_yolov1_ort_web.cjs "$model" 2>&1 | tee -a "$log"
            code=${PIPESTATUS[0]}
            echo "exit_code=$code" | tee -a "$log"
          done
          exit 0

      - name: Publish experiment summary
        if: always()
        run: |
          echo "## YOLOv1 compact feasibility" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/yolov1-compact/report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report=json.loads(Path("artifacts/yolov1-compact/report.json").read_text())
          print("| candidate | MiB | golden |")
          print("|---|---:|---|")
          for key, value in report.get("artifacts", {}).items():
              ort=value.get("ort", {})
              print(f"| {key} | {value.get('mib','—')} | {ort.get('golden_pass','—')} |")
          if report.get("errors"):
              print("\nErrors:")
              for key, value in report["errors"].items():
                  print(f"- {key}: {value}")
          PY
          fi
          for log in artifacts/yolov1-compact/web-smoke/*.log; do
            [ -f "$log" ] || continue
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$(basename "$log")\`" >> "$GITHUB_STEP_SUMMARY"
            tail -n 3 "$log" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Gate compact production candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("artifacts/yolov1-compact/report.json").read_text())
          candidate=report["artifacts"]["dynamic_int8_local_int4_b128"]
          agreement=report["agreement_b128_vs_dynamic_int8"]
          assert candidate["bytes"] < 160_000_000, candidate["bytes"]
          assert candidate["ort"]["golden_pass"] is True
          assert agreement["baseline_match_ratio"] == 1.0, agreement
          assert all(row["mean_matched_iou"] >= 0.95 for row in agreement["images"]), agreement
          log=Path("artifacts/yolov1-compact/web-smoke/dynamic-int8-local-int4-b128.log").read_text()
          assert '"status":"passed"' in log and "exit_code=0" in log, log
          print(candidate["sha256"])
          PY

      - name: Publish checksum-pinned compact YOLOv1 release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          model="artifacts/yolov1-compact/yolov1-voc20-dynamic-int8-local-int4-b128.onnx"
          sha="$(sha256sum "$model" | cut -d ' ' -f 1)"
          tag="yolov1-browser-compact-\${sha:0:12}"
          cp artifacts/yolov1-compact/report.json "$RUNNER_TEMP/yolov1-compact-report.json"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$model" "$RUNNER_TEMP/yolov1-compact-report.json#yolov1-compact-report.json" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$model" "$RUNNER_TEMP/yolov1-compact-report.json#yolov1-compact-report.json" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "YOLOv1 compact browser \${sha:0:12}" \
              --notes "Full YOLOv1 architecture with the 7x7 local layer rewritten exactly as 49 per-location MatMuls and weight-only INT4-quantized. Existing Conv/FC dynamic INT8 path retained. Canonical dog/bicycle/car golden, four-image baseline agreement, native ORT, and ONNX Runtime Web/WASM smoke passed. SHA-256: $sha"
          fi
          echo "YOLOV1_COMPACT_TAG=$tag" >> "$GITHUB_ENV"
          echo "YOLOV1_COMPACT_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Prepare Pages chunks
        run: |
          set -euo pipefail
          model="artifacts/yolov1-compact/yolov1-voc20-dynamic-int8-local-int4-b128.onnx"
          dir="assets/models/yolov1"
          mkdir -p "$dir"
          rm -f "$dir"/part-*.bin "$dir"/compact-b128-part-*.bin
          split -b 95000000 -d -a 2 "$model" "$dir/compact-b128-part-"
          for f in "$dir"/compact-b128-part-*; do mv "$f" "$f.bin"; done
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("assets/models/yolov1")
          model=Path("artifacts/yolov1-compact/yolov1-voc20-dynamic-int8-local-int4-b128.onnx")
          digest=hashlib.sha256(model.read_bytes()).hexdigest()
          parts=[]
          for path in sorted(root.glob("compact-b128-part-*.bin")):
              parts.append({
                  "file": path.name,
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          manifest={
              "sourceRelease": "yolov1-browser-compact-" + digest[:12],
              "sourceFile": model.name,
              "bytes": model.stat().st_size,
              "sha256": digest,
              "chunkBytes": 95000000,
              "quantization": {
                  "base": "dynamic INT8 Conv/FC",
                  "localLayer": "49 exact per-location MatMulNBits INT4",
                  "blockSize": 128,
              },
              "parts": parts,
          }
          root.joinpath("manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY

      - name: Commit compact Pages chunks to experiment branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/models/yolov1
          if git diff --cached --quiet; then
            echo "Compact Pages chunks already match."
            exit 0
          fi
          git commit -m "Stage compact YOLOv1 Pages chunks"
          git push origin HEAD:experiment/yolov1-compact

      - name: Upload small feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yolov1-compact-feasibility-evidence
          path: |
            artifacts/yolov1-compact/report.json
            artifacts/yolov1-compact/web-smoke/*.log
          if-no-files-found: warn
          retention-days: 7
