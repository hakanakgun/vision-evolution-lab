name: Resolution Microscope browser smoke

on:
  push:
    branches:
      - feat/resolution-microscope
    paths:
      - ".github/workflows/resolution-microscope-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install browser harness
        run: npm install --prefix "$RUNNER_TEMP/resolution-smoke" --no-save --no-audit --no-fund puppeteer-core@24.16.0

      - name: Run real YOLOX resolution sweep
        env:
          NODE_PATH: ${{ runner.temp }}/resolution-smoke/node_modules
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/vision-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/version.json >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const assert=require('node:assert/strict');
          const path=require('node:path');
          const puppeteer=require('puppeteer-core');

          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME_PATH||'/usr/bin/google-chrome',
              headless:true,
              protocolTimeout:180000,
              args:['--no-sandbox','--disable-dev-shm-usage','--js-flags=--max-old-space-size=4096']
            });
            try{
              const page=await browser.newPage();
              page.setDefaultTimeout(60000);
              await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
              await page.goto('http://127.0.0.1:4173/?ort=wasm',{waitUntil:'networkidle2',timeout:60000});
              const input=await page.$('#image-file');
              assert.ok(input,'Time Machine image input missing');
              await input.uploadFile(path.resolve('assets/benchmark/coco-val-000000397133.jpg'));
              await page.waitForFunction(()=>{
                const status=document.querySelector('#status')?.textContent||'';
                return /detection/i.test(status)&&!/failed|error/i.test(status);
              },{timeout:180000});

              await page.click('[data-tab="resolution-microscope"]');
              await page.waitForSelector('#resolution-microscope.active');
              const context=await page.$eval('#resolution-context',el=>el.textContent);
              assert.match(context,/YOLOX-Nano/);
              assert.match(context,/native model preprocessing unchanged/);
              await page.click('#resolution-run');
              await page.waitForFunction(()=>/Resolution sweep complete/i.test(document.querySelector('#resolution-status')?.textContent||''),{timeout:180000});

              const result=await page.evaluate(()=>({
                cards:[...document.querySelectorAll('[data-resolution-level]')].map(card=>({
                  level:card.dataset.resolutionLevel,
                  text:card.textContent,
                  canvasHidden:card.querySelector('canvas')?.hidden
                })),
                status:document.querySelector('#resolution-status')?.textContent||'',
                columns:getComputedStyle(document.querySelector('#resolution-grid')).gridTemplateColumns
              }));
              assert.deepEqual(result.cards.map(x=>x.level),['original','640','320','160']);
              assert.ok(result.cards.every(x=>x.canvasHidden===false));
              assert.match(result.cards[0].text,/baseline/);
              assert.match(result.cards[2].text,/320/);
              assert.match(result.cards[3].text,/160/);
              assert.match(result.status,/not ground truth/i);

              await page.setViewport({width:390,height:844,deviceScaleFactor:1});
              await page.waitForTimeout(100);
              const mobile=await page.evaluate(()=>({
                columns:getComputedStyle(document.querySelector('#resolution-grid')).gridTemplateColumns,
                panelWidth:document.querySelector('#resolution-microscope').getBoundingClientRect().width,
                viewport:document.documentElement.clientWidth
              }));
              assert.equal(mobile.columns.trim().split(/\s+/).length,1);
              assert.ok(mobile.panelWidth<=mobile.viewport+1,'Resolution panel overflows mobile viewport');
              console.log(JSON.stringify({status:'passed',runtime:'YOLOX-Nano/WASM',cards:result.cards.map(x=>x.level),mobile:'390x844'}));
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
