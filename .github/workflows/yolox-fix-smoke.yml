name: temporary YOLOX adapter smoke

on:
  push:
    branches:
      - fix/yolox-class-aware-nms
    paths:
      - .github/workflows/yolox-fix-smoke.yml
      - src/models/race.js
      - src/models/models.js
      - index.html

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install temporary browser driver
        run: npm install --prefix "$RUNNER_TEMP/yolox-smoke" --no-save --no-audit --no-fund puppeteer-core@24.26.1

      - name: Serve static app
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >"$RUNNER_TEMP/http.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/http.pid"
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/version.json >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/http.log"
          exit 1

      - name: Run real YOLOX adapter inference
        env:
          NODE_PATH: ${{ runner.temp }}/yolox-smoke/node_modules
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          node <<'NODE'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            try {
              const page = await browser.newPage();
              page.on('console', msg => console.log('[browser]', msg.type(), msg.text()));
              page.on('pageerror', err => console.error('[pageerror]', err.message));
              await page.goto('http://127.0.0.1:8000/?ort=wasm', {
                waitUntil: 'networkidle2',
                timeout: 120000
              });
              await page.waitForFunction(
                () => Boolean(window.VisionRuntimeRegistry?.get?.('yolox')),
                { timeout: 30000 }
              );
              const result = await page.evaluate(async () => {
                const confidence = document.getElementById('confidence');
                confidence.value = '0.10';
                confidence.dispatchEvent(new Event('input', { bubbles: true }));

                const image = new Image();
                image.src = 'assets/benchmark/coco-val-000000397133.jpg';
                await image.decode();

                const canvas = document.createElement('canvas');
                const adapter = window.VisionRuntimeRegistry.get('yolox');
                await adapter.prepare();
                try {
                  const run = await adapter.run(image, canvas, {});
                  return {
                    retained: run.retained,
                    visible: run.visible,
                    backend: adapter.runtimeInfo?.().backend || '',
                    labels: run.detections.map(d => d.label),
                    personScores: run.detections
                      .filter(d => d.label === 'person')
                      .map(d => Number(d.score.toFixed(6)))
                  };
                } finally {
                  await adapter.release();
                }
              });
              console.log(JSON.stringify(result));
              if (!(result.retained > 0)) throw new Error('YOLOX adapter returned no retained detections');
              if (!result.labels.includes('person')) throw new Error('YOLOX adapter did not return person on the licensed COCO smoke image');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
