name: YOLOv1 external-data graph

on:
  push:
    branches:
      - feat/yolov1-jspi-external-data-poc
    paths:
      - ".github/workflows/yolov1-external-data.yml"
      - "scripts/build_yolov1_external_graph.py"
      - "tools/smoke_yolov1_external_ort_web.cjs"
      - "assets/models/yolov1/part-*.bin"
      - "src/core/external-data-store.js"
      - "src/models/historical-detectors.js"
      - "src/models/models.js"
      - "scripts/validate.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Runner capacity
        run: |
          free -h
          df -h /
          nproc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install graph validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "onnx>=1.16,<2" "onnxruntime>=1.23,<2"
          python - <<'PY'
          import numpy, onnx, onnxruntime
          print("numpy", numpy.__version__)
          print("onnx", onnx.__version__)
          print("onnxruntime", onnxruntime.__version__)
          PY

      - name: Build and verify external-data graph
        run: /usr/bin/time -v python scripts/build_yolov1_external_graph.py

      - name: Install pinned ONNX Runtime Web
        run: npm install --prefix "$RUNNER_TEMP/yolov1-webtest" --no-save --no-audit --no-fund onnxruntime-web@1.30.0

      - name: Smoke external-data graph in ONNX Runtime Web
        run: |
          NODE_PATH="$RUNNER_TEMP/yolov1-webtest/node_modules" \
            node tools/smoke_yolov1_external_ort_web.cjs \
            artifacts/yolov1-external-data/yolov1-voc20-int8-external.onnx \
            artifacts/yolov1-external-data/yolov1-voc20-int8.onnx

      - name: Validate repository contracts
        run: node scripts/validate.mjs

      - name: Commit generated graph and manifest
        run: |
          git add assets/models/yolov1/yolov1-voc20-int8-external.onnx assets/models/yolov1/external-data-manifest.json
          if git diff --cached --quiet; then
            echo "Generated files already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate YOLOv1 external-data graph [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Summary
        if: always()
        run: |
          if [ -f assets/models/yolov1/external-data-manifest.json ]; then
            cat assets/models/yolov1/external-data-manifest.json >> "$GITHUB_STEP_SUMMARY"
          fi
          free -h
          df -h /
