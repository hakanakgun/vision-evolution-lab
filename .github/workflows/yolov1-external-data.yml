name: YOLOv1 external-data graph

on:
  pull_request:
    paths:
      - ".github/workflows/yolov1-external-data.yml"
      - "scripts/build_yolov1_external_graph.py"
      - "tools/smoke_yolov1_external_ort_web.cjs"
      - "tools/smoke_yolov1_jspi_browser.cjs"
      - "assets/models/yolov1/part-*.bin"
      - "assets/models/yolov1/yolov1-voc20-int8-external.onnx"
      - "assets/models/yolov1/external-data-manifest.json"
      - "src/core/external-data-store.js"
      - "src/models/historical-detectors.js"
      - "src/models/models.js"
      - "scripts/validate.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner capacity
        run: |
          free -h
          df -h /
          nproc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned graph validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" "onnx==1.23.0" "onnxruntime==1.30.0"
          python - <<'PY'
          import numpy, onnx, onnxruntime
          print("numpy", numpy.__version__)
          print("onnx", onnx.__version__)
          print("onnxruntime", onnxruntime.__version__)
          PY

      - name: Rebuild and verify external-data graph
        run: /usr/bin/time -v python scripts/build_yolov1_external_graph.py

      - name: Install pinned browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/yolov1-webtest" --no-save --no-audit --no-fund onnxruntime-web@1.30.0 puppeteer-core@24.23.0

      - name: Smoke external-data graph in ONNX Runtime Web
        run: |
          NODE_PATH="$RUNNER_TEMP/yolov1-webtest/node_modules" \
            node tools/smoke_yolov1_external_ort_web.cjs \
            artifacts/yolov1-external-data/yolov1-voc20-int8-external.onnx \
            artifacts/yolov1-external-data/yolov1-voc20-int8.onnx

      - name: Smoke JSPI + OPFS File path in headless Chrome
        run: |
          NODE_PATH="$RUNNER_TEMP/yolov1-webtest/node_modules" \
            node tools/smoke_yolov1_jspi_browser.cjs \
            artifacts/yolov1-external-data/yolov1-voc20-int8-external.onnx \
            artifacts/yolov1-external-data/yolov1-voc20-int8.onnx \
            "$RUNNER_TEMP/yolov1-webtest/node_modules/onnxruntime-web/dist"

      - name: Validate repository contracts
        run: node scripts/validate.mjs

      - name: Verify generated files are committed exactly
        run: git diff --exit-code -- assets/models/yolov1/yolov1-voc20-int8-external.onnx assets/models/yolov1/external-data-manifest.json

      - name: Summary
        if: always()
        run: |
          if [ -f assets/models/yolov1/external-data-manifest.json ]; then
            cat assets/models/yolov1/external-data-manifest.json >> "$GITHUB_STEP_SUMMARY"
          fi
          free -h
          df -h /
