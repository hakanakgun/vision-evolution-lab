name: temporary YOLOX live WASM smoke

on:
  push:
    branches:
      - fix/yolox-live-wasm
    paths:
      - .github/workflows/yolox-live-wasm-smoke.yml
      - src/app.js
      - src/models/models.js
      - src/models/race.js

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/yolox-live" --no-save --no-audit --no-fund puppeteer-core@24.26.1
      - name: Serve app
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >"$RUNNER_TEMP/http.log" 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/version.json >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify capability-driven Live Camera WASM path
        env:
          NODE_PATH: ${{ runner.temp }}/yolox-live/node_modules
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage();
              await page.goto('http://127.0.0.1:8000/?ort=jsep',{waitUntil:'networkidle2',timeout:120000});
              await page.waitForFunction(()=>Boolean(window.VisionRuntimeRegistry?.get?.('yolox')),{timeout:30000});
              const result=await page.evaluate(async()=>{
                const adapter=window.VisionRuntimeRegistry.get('yolox');
                const meta=window.VisionRuntimeRegistry.liveMeta(adapter.model);
                if(meta?.forceBackend!=='wasm')throw new Error('YOLOX live capability is not pinned to WASM');
                const options={live:true,forceBackend:meta.forceBackend,allowFallback:false};
                await adapter.prepare(options);
                try{
                  const image=new Image();image.src='assets/benchmark/coco-val-000000397133.jpg';await image.decode();
                  const canvas=document.createElement('canvas');
                  const run=await adapter.run(image,canvas,options);
                  return{
                    backend:adapter.runtimeInfo().backend,
                    visible:run.visible,
                    retained:run.retained,
                    personScores:run.detections.filter(d=>d.label==='person').map(d=>Number(d.score.toFixed(6)))
                  };
                }finally{await adapter.release()}
              });
              console.log(JSON.stringify(result));
              if(result.backend!=='wasm')throw new Error('Live YOLOX backend was '+result.backend+', expected wasm');
              if(!result.personScores.some(score=>score>=0.4))throw new Error('No visible person detection at default confidence');
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
