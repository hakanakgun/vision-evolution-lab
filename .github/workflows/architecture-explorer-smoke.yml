name: Architecture Explorer browser smoke

on:
  push:
    branches:
      - feat/architecture-explorer
    paths:
      - ".github/workflows/architecture-explorer-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install browser harness
        run: npm install --prefix "$RUNNER_TEMP/architecture-smoke" --no-save --no-audit --no-fund puppeteer-core@24.16.0
      - name: Verify Architecture Explorer
        env:
          NODE_PATH: ${{ runner.temp }}/architecture-smoke/node_modules
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/vision-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/version.json >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const assert=require('node:assert/strict');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH||'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage();page.setDefaultTimeout(45000);
              await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
              await page.goto('http://127.0.0.1:4173/?ort=wasm',{waitUntil:'networkidle2'});
              await page.click('[data-tab="architecture-explorer"]');
              await page.waitForSelector('#architecture-explorer.active');
              const initial=await page.evaluate(()=>({
                a:document.querySelector('#architecture-a')?.value,
                b:document.querySelector('#architecture-b')?.value,
                profiles:[document.querySelector('#architecture-profile-a')?.textContent||'',document.querySelector('#architecture-profile-b')?.textContent||''],
                options:document.querySelector('#architecture-a')?.options.length||0,
                status:document.querySelector('#architecture-status')?.textContent||''
              }));
              assert.equal(initial.a,'fasterrcnn');
              assert.equal(initial.b,'rtdetr');
              assert.ok(initial.options>=10);
              assert.match(initial.profiles[0],/Faster R-CNN/);
              assert.match(initial.profiles[0],/two-stage|Region Proposal|RPN/i);
              assert.match(initial.profiles[1],/RT-DETR R18/);
              assert.match(initial.profiles[1],/Query|set prediction|decoder/i);
              assert.match(initial.status,/No inference|declared browser contracts/i);

              await page.select('#architecture-a','yolov1');
              await page.waitForFunction(()=>/YOLOv1/.test(document.querySelector('#architecture-profile-a')?.textContent||''));
              const yolo=await page.$eval('#architecture-profile-a',el=>el.textContent);
              assert.match(yolo,/448/);
              assert.match(yolo,/grid|single-pass/i);
              assert.match(yolo,/internal|not exposed/i);

              await page.setViewport({width:390,height:844,deviceScaleFactor:1});
              await new Promise(resolve=>setTimeout(resolve,100));
              const mobile=await page.evaluate(()=>({
                columns:getComputedStyle(document.querySelector('.architecture-explorer-grid')).gridTemplateColumns,
                panelWidth:document.querySelector('#architecture-explorer').getBoundingClientRect().width,
                viewport:document.documentElement.clientWidth
              }));
              assert.equal(mobile.columns.trim().split(/\s+/).length,1);
              assert.ok(mobile.panelWidth<=mobile.viewport+1);
              console.log(JSON.stringify({status:'passed',defaults:[initial.a,initial.b],options:initial.options,mobile:'390x844'}));
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
