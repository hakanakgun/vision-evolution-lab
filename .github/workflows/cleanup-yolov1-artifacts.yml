name: Cleanup temporary YOLOv1 artifacts

on:
  push:
    branches:
      - feat/yolov1-browser
    paths:
      - ".github/workflows/cleanup-yolov1-artifacts.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete redundant large feasibility artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 10900609467 10901313123; do
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "deleted artifact $id"
          done
