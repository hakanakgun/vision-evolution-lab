name: temporary v0.17 feature smoke

on:
  push:
    branches:
      - feat/live-confidence-accuracy-inspection
    paths:
      - .github/workflows/v017-feature-smoke.yml

permissions:
  contents: read

jobs:
  validate-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate repository contracts
        run: node scripts/validate.mjs
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/v017-smoke" --no-save --no-audit --no-fund puppeteer-core@24.26.1
      - name: Serve app
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >"$RUNNER_TEMP/http.log" 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/version.json >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/http.log"
          exit 1
      - name: Verify confidence separation and sanity suite
        env:
          NODE_PATH: ${{ runner.temp }}/v017-smoke/node_modules
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage();
              page.setDefaultTimeout(900000);
              page.on('console',msg=>console.log('[browser]',msg.type(),msg.text()));
              page.on('pageerror',err=>console.error('[pageerror]',err.message));
              await page.goto('http://127.0.0.1:8000/?ort=wasm',{waitUntil:'networkidle2',timeout:120000});
              await page.waitForFunction(()=>window.VisionRuntimeRegistry?.modelKeys?.length>=11);
              const confidence=await page.evaluate(()=>{
                const tm=document.getElementById('confidence'),live=document.getElementById('live-confidence');
                tm.value='0.75';tm.dispatchEvent(new Event('input',{bubbles:true}));
                live.value='0.25';live.dispatchEvent(new Event('input',{bubbles:true}));
                return{tm:tm.value,tmLabel:document.getElementById('confidence-value').textContent,live:live.value,liveLabel:document.getElementById('live-confidence-value').textContent};
              });
              console.log('confidence',JSON.stringify(confidence));
              if(confidence.tm!=='0.75'||confidence.live!=='0.25'||confidence.tmLabel!=='0.75'||confidence.liveLabel!=='0.25')throw new Error('confidence controls are not independent');

              await page.click('[data-tab="model-race"]');
              await page.click('#race-sanity-run');
              await page.waitForFunction(()=>document.getElementById('race-sanity-status').textContent.includes('suite complete'),{timeout:900000});
              const sanity=await page.evaluate(()=>({
                status:document.getElementById('race-sanity-status').textContent,
                rows:[...document.querySelectorAll('#race-sanity-body .race-benchmark-row')].map(row=>row.textContent),
                version:document.querySelector('.footer')?.textContent||''
              }));
              console.log('sanity',JSON.stringify(sanity));
              if(sanity.rows.length!==5)throw new Error('expected five sanity-suite model rows, got '+sanity.rows.length);
              if(sanity.rows.some(row=>row.includes('failed')))throw new Error('one or more sanity-suite models failed');
              if(!sanity.status.includes('confidence 0.40')||!sanity.status.includes('IoU ≥ 0.50'))throw new Error('fixed sanity matching contract missing');
              if(!sanity.version.includes('v0.17.0'))throw new Error('v0.17.0 footer missing');
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
